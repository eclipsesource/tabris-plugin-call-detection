apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

dependencies {
    implementation 'com.eclipsesource.tabris.android:tabris:3.11.0'
}

android {
    namespace 'com.eclipsesource.tabris.calldetection'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java.srcDirs = ['../../../src/android']
        }
    }
}
